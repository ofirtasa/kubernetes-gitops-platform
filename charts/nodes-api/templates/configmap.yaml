apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodes-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodes-api.labels" . | nindent 4 }}
data:
  APP_ENV: {{ required "config.appEnv is required" .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  K8S_TIMEOUT_SECONDS: {{ .Values.config.k8sTimeoutSeconds | quote }}
