{{- if .Values.networkPolicy.enabled }}
# Selecting the pods for both directions denies everything not listed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nodes-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodes-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nodes-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range required "networkPolicy.albCidrs is required" .Values.networkPolicy.albCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        {{- range required "networkPolicy.apiServerCidrs is required" .Values.networkPolicy.apiServerCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 443
          protocol: TCP
{{- end }}
