{{- if .Values.apiKey.remoteKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "nodes-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nodes-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.apiKey.refreshInterval }}
  # Created by the platform in each environment namespace.
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.apiKey.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.apiKey.secretKey }}
      remoteRef:
        key: {{ .Values.apiKey.remoteKey }}
        property: api_key
{{- end }}
