apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    environment: staging
    # Pod Security Admission: reject pods that do not meet the "restricted" profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # New pods count as ready only after the ALB target group reports them healthy, so a
    # rollout never removes the last healthy target.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
  annotations:
    # Removing the file must not delete the namespace and everything in it.
    argocd.argoproj.io/sync-options: Prune=false
---
# Deny all traffic by default; each workload opens only what it needs with its own policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
