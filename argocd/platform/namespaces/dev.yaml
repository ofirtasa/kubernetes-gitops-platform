apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    environment: dev
    # Pod Security Admission: reject pods that do not meet the "restricted" profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    # Removing the file must not delete the namespace and everything in it.
    argocd.argoproj.io/sync-options: Prune=false
---
# Deny all traffic by default; each workload opens only what it needs with its own policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
