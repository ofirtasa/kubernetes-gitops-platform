# Syncs secrets from AWS Secrets Manager into Kubernetes Secrets. Its own Pod Identity role
# may only assume the per-environment roles named in each SecretStore.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets
      valuesObject:
        serviceAccount:
          create: true
          # Must match the Pod Identity association in Terraform.
          name: external-secrets
        # Only namespaced SecretStores and ExternalSecrets are used. Cluster-wide stores
        # would let any namespace read through one shared identity.
        processClusterStore: false
        processClusterExternalSecret: false
        processClusterGenerator: false
        processPushSecret: false
        processClusterPushSecret: false
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            memory: 256Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  # The cert controller writes the webhook certificate at runtime. Keep the live values.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - kind: Secret
      name: external-secrets-webhook
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too large for the last-applied annotation of client-side apply.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
