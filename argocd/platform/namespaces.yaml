apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/ofirtasa/kubernetes-gitops-platform.git
    targetRevision: main
    path: argocd/platform/namespaces
  destination:
    server: https://kubernetes.default.svc
    # Required by the AppProject check. Unused: Namespaces are cluster-scoped and each
    # NetworkPolicy sets its own namespace.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
