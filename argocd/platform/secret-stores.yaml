apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    # After the namespaces and the External Secrets CRDs exist.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/ofirtasa/kubernetes-gitops-platform.git
    targetRevision: main
    path: argocd/platform/secret-stores
  destination:
    server: https://kubernetes.default.svc
    # Unused: every SecretStore sets its own namespace.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
