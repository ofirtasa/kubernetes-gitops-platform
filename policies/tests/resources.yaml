# One compliant Deployment, and one per policy that breaks only that policy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant
  namespace: dev
spec:
  selector:
    matchLabels:
      app: compliant
  template:
    metadata:
      labels:
        app: compliant
    spec:
      containers:
        - name: app
          image: 404386756450.dkr.ecr.eu-north-1.amazonaws.com/nodes-api:142ce4050219cca61183939688f4c78462f19edd
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
