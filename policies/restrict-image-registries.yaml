apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/description: >-
      Workloads in the environment namespaces may run only images from this project's ECR
      registry, where every image was built by CI, scanned, and pushed with an immutable tag.
spec:
  validationActions: [Deny]
  matchConstraints:
    # Only the environment namespaces (dev, staging, prod), not the platform add-ons.
    namespaceSelector:
      matchExpressions:
        - key: environment
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # Also checks Deployments and other controllers, so Argo CD reports the violation at sync
  # instead of a ReplicaSet failing to create pods later.
  autogen:
    podControllers:
      controllers: [deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('404386756450.dkr.ecr.eu-north-1.amazonaws.com/'))
      message: Images must come from 404386756450.dkr.ecr.eu-north-1.amazonaws.com.
