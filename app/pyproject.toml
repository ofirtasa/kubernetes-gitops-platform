[project]
name = "nodes-api"
version = "0.1.0"
description = "Lists the Kubernetes nodes of the cluster and marks the node the pod runs on."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi~=0.162.0",
    "uvicorn~=0.54.0",
    "kubernetes~=37.0",
    "prometheus-client~=0.26.0",
]

[dependency-groups]
dev = [
    "pytest~=9.2",
    "httpx~=0.28.1",
    "ruff~=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
